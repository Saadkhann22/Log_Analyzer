name: CI/CD

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t log-triage-agent .

      - name: Start stack for testing
        run: docker compose up -d
        env:
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Wait for database to be healthy
        run: sleep 10

      - name: Set up database schema
        run: |
          docker compose exec -T db psql -U postgres -d log_analyzer -c "CREATE EXTENSION IF NOT EXISTS vector;"
          docker compose exec -T app python db_seed.py

      - name: Seed data
        run: docker compose exec -T app python db_seed.py

      - name: Run tests
        run: docker compose exec -T app python test_all.py

      - name: Tear down
        if: always()
        run: docker compose down

