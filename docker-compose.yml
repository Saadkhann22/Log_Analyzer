services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env              # GEMINI_API_KEY lives here, not in this file
    environment:
      DB_HOST: db             
      DB_PORT: "5432"
      DB_NAME: log_analyzer
      DB_USER: postgres
      DB_PASSWORD: password123 
      CHECKPOINT_DB: /data/checkpoints.db
    volumes:
      - checkpoints:/data      
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: log_analyzer     # ← must match the app's DB_NAME
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    # no ports: — your host Postgres owns 5432; app talks over the internal network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d log_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  checkpoints:
